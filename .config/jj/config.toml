#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Creston Bunch"
email = "git@bunch.im"

[ui]
diff-editor = "diffview"
diff-formatter = ["difft", "--color=always", "$left", "$right"]
merge-editor = "nvimdiff"
[merge-tools.nvimdiff]
program = "nvim"
merge-args = [
  "-d", "$output",
  "-c", "rightbelow vert diffsplit $base",
  "-c", "wincmd h",
  "-c", "rightbelow diffsplit $left",
  "-c", "wincmd l",
  "-c", "rightbelow diffsplit $right",
  "-c", "wincmd t",
  "-c", "nnoremap <buffer> <leader>l :diffget 3<CR>",
  "-c", "nnoremap <buffer> <leader>b :diffget 2<CR>",
  "-c", "nnoremap <buffer> <leader>r :diffget 4<CR>",
]

[merge-tools.diffview]
# https://github.com/jj-vcs/jj/wiki/Vim,-Neovim
program = "sh"
edit-args = ["-c", '''
  set -eu
  rm -f "$right/JJ-INSTRUCTIONS"
  git -C "$left" init -q
  git -C "$left" add -A
  git -C "$left" commit -q -m baseline --allow-empty
  mv "$left/.git" "$right"
  (cd "$right"; nvim -c DiffviewOpen)
  # git -C "$right" add -p
  git -C "$right" diff-index --quiet --cached HEAD && { echo "No changes done, aborting split."; exit 1; }
  git -C "$right" commit -q -m split
  git -C "$right" restore . # undo changes in modified files
  git -C "$right" reset .   # undo --intent-to-add
  git -C "$right" clean -q -df # remove untracked files
''',
]

[remotes.origin]
auto-track-bookmarks = "glob:creston/*"
auto-track-created-bookmarks = "glob:creston/*"

[revsets]
log = "present(@) | ancestors((mine() ~ ::trunk()) | @, 2) | present(trunk())"

[revset-aliases]
"stack()" = "trunk()..@"

[ai]
backend = "pi"
pi-model = "openai-codex/gpt-5.6-terra"
claude-model = "sonnet"

[aliases]
# lob: like `jj log` but restricted to bookmarked revisions. Non-bookmarked
# revisions are elided (shown as `~`).
lob = ["log", "-r", "bookmarks()"]

# Run pre-commit on files changed in a revset (default: @). Auto-fixes land in
# their own revision on top of @ — never absorbed or squashed back into the
# revisions that introduced them — and the scratch revision is abandoned if
# pre-commit changed nothing.
#   jj precommit                       # check current change
#   jj precommit 'trunk()..@'          # check whole stack
precommit = ["util", "exec", "--", "sh", "-c", '''
set -eu
revset="${1:-@}"
files=$(jj diff --name-only -r "$revset")
if [ -z "$files" ]; then
  echo "No files changed in $revset"
  exit 0
fi
start_change=$(jj log --no-graph -r '@' -T 'change_id')
# An already-empty @ is a usable scratch; only stack a new one onto real work.
if [ -n "$(jj log --no-graph -r '@ & ~empty()' -T 'change_id' 2>/dev/null)" ]; then
  jj new
fi
status=0
pre-commit run --files $files || status=$?
if [ -n "$(jj log --no-graph -r '@ & ~empty()' -T 'change_id' 2>/dev/null)" ]; then
  if [ -z "$(jj log --no-graph -r '@' -T 'description')" ]; then
    jj describe -m 'Apply pre-commit fixes'
  fi
elif [ "$(jj log --no-graph -r '@' -T 'change_id')" != "$start_change" ]; then
  # `jj edit` auto-abandons the empty scratch (no descendants, no bookmarks).
  # Don't use `jj abandon` here — abandoning @ always synthesizes a new wc on
  # the parent.
  jj edit "$start_change"
fi
# A non-zero first run can mean either auto-fixes were applied or there are
# unfixable issues. Re-run over the same files to distinguish: a clean second
# run means everything was auto-fixed, so treat it as success.
if [ "$status" -ne 0 ]; then
  pre-commit run --files $files
fi
''', "jj-precommit"]

# `jj b`         — bookmark the most recent non-empty change in trunk()..@,
#                  slugged from its description.
b = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
rev="latest(trunk()..@ & ~empty())"
subject=$(jj log --no-graph -r "$rev" -T 'description.first_line()' 2>/dev/null)
if [[ -z $subject ]]; then
  echo "b: no non-empty change between trunk and @" >&2
  exit 1
fi
slug=$(printf '%s' "$subject" \
  | tr '[:upper:]' '[:lower:]' \
  | sed -E 's/[^a-z0-9]+/-/g; s/(^-+|-+$)//g')
if (( ${#slug} > 32 )); then
  slug=${slug:0:32}
  slug=${slug%-*}
fi
[[ -z $slug ]] && slug=wip
date=$(date +%m-%d)
branch="${USER}/${date}-${slug}"
if ! jj bookmark create "$branch" -r "$rev" 2>/dev/null; then
  suffix=$(jj log --no-graph -r "$rev" -T 'change_id.shortest()')
  branch="${branch}-${suffix}"
  jj bookmark create "$branch" -r "$rev"
fi
printf 'bookmark: %s @ %s\n' "$branch" "$(jj log --no-graph -r "$rev" -T 'commit_id.short()')"
''', "jj-b"]

# bb: list local bookmarks in trunk()..@ (mine), nearest to @ first.
bb = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
out=$(jj log --ignore-working-copy --no-graph \
  -r "trunk()..@ & bookmarks() & mine()" \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' 2>/dev/null)
if [[ -z ${out:-} ]]; then
  echo "no bookmark found between trunk and @" >&2
  exit 1
fi
printf '%s\n' "$out"
''', "jj-bb"]

# bbt: like `bb`, but continues down to and including the trunk bookmark, which
# is pinned at the bottom. Unlike `bb` it never errors on an empty stack. Use
# where trunk must always appear (e.g. the statusline); `bb` stays the
# trunk-free list that bm/pr-* consume via `head -n1` and `while read` loops.
bbt = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
stack=$(jj log --ignore-working-copy --no-graph \
  -r "trunk()..@ & bookmarks() & mine()" \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' 2>/dev/null)
# Prefer a local trunk bookmark; fall back to a remote one (first line dedupes
# main@git / main@origin) for repos whose trunk is remote-only.
trunk=$(jj log --ignore-working-copy --no-graph -r 'trunk()' \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' 2>/dev/null)
trunk=${trunk%%$'\n'*}
if [[ -z ${trunk:-} ]]; then
  trunk=$(jj log --ignore-working-copy --no-graph -r 'trunk()' \
    -T 'remote_bookmarks.map(|b| b.name() ++ "\n").join("")' 2>/dev/null)
  trunk=${trunk%%$'\n'*}
fi
if [[ -n ${stack:-} ]]; then
  printf '%s\n' "$stack"
fi
if [[ -n ${trunk:-} ]]; then
  printf '%s\n' "$trunk"
fi
''', "jj-bbt"]

# bs: bookmark stack. List local bookmarks in the whole stack that holds @,
# bottom first (closest to trunk). `bb` stops at @, so a bookmark above @ is
# invisible to it. `bs` walks up to the head above @ too, which is what the PR
# aliases need: a PR created on a middle bookmark must still see the PRs
# stacked above it. If @ has more than one descendant head, the stack above @
# is ambiguous, so `bs` falls back to the `bb` scope and warns.
bs = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
heads=$(jj log --ignore-working-copy --no-graph -r 'heads(@::)' \
  -T 'change_id ++ "\n"' 2>/dev/null | awk 'NF')
count=$(printf '%s\n' "$heads" | awk 'NF' | wc -l | tr -d ' ')
if [[ $count -eq 1 ]]; then
  top="$heads"
else
  printf 'bs: @ has %s descendant heads, limiting the stack to trunk()..@\n' "$count" >&2
  top='@'
fi
out=$(jj log --ignore-working-copy --no-graph \
  -r "trunk()..($top) & bookmarks() & mine()" \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' 2>/dev/null \
  | awk 'NF { lines[++n] = $0 } END { for (i = n; i > 0; i--) print lines[i] }')
if [[ -z ${out:-} ]]; then
  echo "no bookmark found in the stack" >&2
  exit 1
fi
printf '%s\n' "$out"
''', "jj-bs"]

# bm: bookmark move. Find the closest bookmark in trunk()..@, target @ (or @-
# if @ is empty), rebase descendants of the bookmark's old position that
# aren't on the line through the target onto the target, and move the
# bookmark.
bm = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bb | head -n1)
if [[ -n $(jj log --no-graph -r "@ & empty()" -T 'change_id' 2>/dev/null) ]]; then
  target="@-"
else
  target="@"
fi
old_rev=$(jj log --no-graph -r "$name" -T 'change_id')
new_rev=$(jj log --no-graph -r "$target" -T 'change_id')
if [[ "$old_rev" != "$new_rev" ]]; then
  descendants=$(jj log --no-graph --ignore-working-copy \
    -r "roots(((${old_rev}::) ~ ${old_rev}) & ~(::${new_rev}) & ~(${new_rev}::))" \
    -T 'change_id ++ "\n"' 2>/dev/null)
  if [[ -n "$descendants" ]]; then
    rebase_args=()
    while IFS= read -r rev; do
      [[ -z "$rev" ]] && continue
      rebase_args+=(-s "$rev")
    done <<<"$descendants"
    jj rebase "${rebase_args[@]}" -d "$new_rev"
  fi
  jj bookmark move "$name" --to "$new_rev" --allow-backwards
fi
''', "jj-bm"]

# bmt: like `bm`, but includes the trunk bookmark as a fallback when there
# are no stack bookmarks between trunk and @.
bmt = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bbt | head -n1)
if [[ -z "$name" ]]; then
  echo "bmt: no bookmark found" >&2
  exit 1
fi
if [[ -n $(jj log --no-graph -r "@ & empty()" -T 'change_id' 2>/dev/null) ]]; then
  target="@-"
else
  target="@"
fi
old_rev=$(jj log --no-graph -r "$name" -T 'change_id')
new_rev=$(jj log --no-graph -r "$target" -T 'change_id')
if [[ "$old_rev" != "$new_rev" ]]; then
  descendants=$(jj log --no-graph --ignore-working-copy \
    -r "roots(((${old_rev}::) ~ ${old_rev}) & ~(::${new_rev}) & ~(${new_rev}::))" \
    -T 'change_id ++ "\n"' 2>/dev/null)
  if [[ -n "$descendants" ]]; then
    rebase_args=()
    while IFS= read -r rev; do
      [[ -z "$rev" ]] && continue
      rebase_args+=(-s "$rev")
    done <<<"$descendants"
    jj rebase "${rebase_args[@]}" -d "$new_rev"
  fi
  jj bookmark move "$name" --to "$new_rev" --allow-backwards
fi
''', "jj-bmt"]

# pr: dispatch to a pr-* subcommand (e.g. `jj pr merge` -> `jj pr-merge`).
pr = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
sub="${1:-help}"
shift || true
case "$sub" in
  help|-h|--help)
    cat <<EOF
jj pr <subcommand> [args]

Subcommands:
  open       Open the GitHub PR for the nearest bookmark in a browser
  status     Show CI status checks for the nearest bookmark's PR
  create     Create a GitHub PR for the nearest bookmark
  describe   Draft a PR description with the configured AI and update the PR
  edit       Edit the PR title and description in \$EDITOR
  assign     Pick reviewer(s) via fzf and request review on the PR
  comments   Browse review comments and reply to one via $EDITOR
  update     Fetch trunk, rebase the stack, push, and sync the PRs
  push       Run pre-commit on the stack and push every bookmark
  rebase     Reconcile each open PR base to match the current stack
  merge      Merge the nearest bookmark PR (with safety checks)
  cleanup    After a merge, forget the local bookmark and rebase onto trunk
  close      Close the nearest bookmark PR and forget the local bookmark
  abandon    Run \`pr close\` and abandon the PR's revisions
EOF
    ;;
  open|status|create|describe|edit|assign|comments|update|push|rebase|merge|cleanup|close|abandon)
    exec jj "pr-$sub" "$@"
    ;;
  *)
    echo "jj pr: unknown subcommand: $sub" >&2
    exit 1
    ;;
esac
''', "jj-pr"]

# pr-open: open the GitHub PR for the bookmark closest to @ (in trunk()..@, mine).
pr-open = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bb | head -n1)
exec gh pr view --web "$name"
''', "jj-pr-open"]

# pr-status: show a summary of the PR for the bookmark closest to @ — title,
# local vs remote head SHA, change stats, and CI checks (skipped ones omitted).
# Status indicators match `work`: top-level PR emoji (📝/🔴/📤/🟢/❎/🔁), reviewer
# state emoji (✅/❌/❓/⊘/⏳), check bucket emoji (✅/🔴/⊘/⏳), and 💬 for threads.
pr-status = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bb | head -n1)
local_sha=$(jj log --no-graph -r "$name" -T 'commit_id')
pr_data=$(gh pr view "$name" --json number,title,headRefOid,additions,deletions,changedFiles,reviewRequests,latestReviews,isDraft,reviewDecision)
number=$(jq -r .number <<<"$pr_data")
title=$(jq -r .title <<<"$pr_data")
remote_sha=$(jq -r .headRefOid <<<"$pr_data")
additions=$(jq -r .additions <<<"$pr_data")
deletions=$(jq -r .deletions <<<"$pr_data")
changed_files=$(jq -r .changedFiles <<<"$pr_data")
is_draft=$(jq -r .isDraft <<<"$pr_data")
review_decision=$(jq -r '.reviewDecision // ""' <<<"$pr_data")
if [[ "$local_sha" == "$remote_sha" ]]; then
  sync="in sync"
else
  sync="out of sync"
fi
all_json=$(gh pr checks "$name" --json bucket,name 2>/dev/null || true)
required_json=$(gh pr checks "$name" --required --json name 2>/dev/null || true)
[[ -z "${all_json:-}" ]] && all_json="[]"
[[ -z "${required_json:-}" ]] && required_json="[]"
failing_required=$(jq --argjson req "$required_json" '
  ($req | map(.name)) as $rn
  | [.[] | select((.name | IN($rn[])) and (.bucket == "fail" or .bucket == "cancel"))] | length
' <<<"$all_json")
pending_required=$(jq --argjson req "$required_json" '
  ($req | map(.name)) as $rn
  | [.[] | select((.name | IN($rn[])) and .bucket == "pending")] | length
' <<<"$all_json")
rev_count=$(jq '
  (([.latestReviews[]? | select(.author.login != null)
    | {(.author.login): (.state // "PENDING")}] | add // {}) as $rev
  | ([.reviewRequests[]? | (.login // .name // empty) | select(. != "")]) as $req
  | reduce $req[] as $u ($rev; .[$u] = "pending")
  | length)
' <<<"$pr_data")
if [[ "$is_draft" == "true" ]]; then
  pr_emoji="📝"
elif (( failing_required > 0 )); then
  pr_emoji="🔴"
elif (( rev_count == 0 )); then
  pr_emoji="📤"
elif [[ "$review_decision" == "APPROVED" ]] && (( pending_required == 0 )); then
  pr_emoji="🟢"
elif [[ "$review_decision" == "APPROVED" ]]; then
  pr_emoji="❎"
elif [[ "$review_decision" == "CHANGES_REQUESTED" ]]; then
  pr_emoji="🔁"
else
  pr_emoji="  "
fi
printf '%s  PR #%s — %s\n\n' "$pr_emoji" "$number" "$title"
printf '  Local:    %s\n' "${local_sha:0:12}"
printf '  Remote:   %s (%s)\n' "${remote_sha:0:12}" "$sync"
printf '  Changes:  +%s -%s across %s file(s)\n' "$additions" "$deletions" "$changed_files"
reviewer_lines=$(jq -r '
  def rank:
    if . == "changes_requested" then 0
    elif . == "pending" then 1
    elif . == "commented" then 2
    elif . == "approved" then 3
    elif . == "dismissed" then 4
    else 5 end;
  def state_emoji:
    if . == "approved" then "✅"
    elif . == "changes_requested" then "❌"
    elif . == "commented" then "❓"
    elif . == "dismissed" then "⊘"
    elif . == "pending" then "⏳"
    else "?"
    end;
  ([.latestReviews[]? | select(.author.login != null)
    | {(.author.login): (.state | ascii_downcase)}] | add // {}) as $rev
  | ([.reviewRequests[]? | (.login // .name // empty) | select(. != "")]) as $req
  | reduce $req[] as $u ($rev; .[$u] = "pending")
  | to_entries
  | sort_by([(.value | rank), .key])
  | .[] | "\(.value | state_emoji)\t\(.key)"
' <<<"$pr_data")
printf '\n👥 Reviewers:\n'
if [[ -z $reviewer_lines ]]; then
  printf '  (none assigned)\n'
else
  while IFS=$'\t' read -r emoji user; do
    printf '  %s  %s\n' "$emoji" "$user"
  done <<<"$reviewer_lines"
fi
repo_info=$(gh repo view --json owner,name)
owner=$(jq -r '.owner.login' <<<"$repo_info")
repo=$(jq -r '.name' <<<"$repo_info")
threads_json=$(gh api graphql \
  -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){author{login}reviewThreads(first:100){nodes{isResolved comments(first:100){nodes{author{login}}}}}}}}' \
  -f owner="$owner" -f repo="$repo" -F number="$number" 2>/dev/null || echo '{}')
metrics=$(jq -r '
  .data.repository.pullRequest as $pr
  | ($pr.author.login // "") as $author
  | ($pr.reviewThreads.nodes // []) as $threads
  | ($threads | map(select(.isResolved | not))) as $open
  | [
      ($threads | length),
      ($open | length),
      ($open | map(select((.comments.nodes | length) == 1)) | length),
      ($open | map(select((.comments.nodes | last | .author.login // "") != $author)) | length)
    ]
  | @tsv
' <<<"$threads_json")
IFS=$'\t' read -r total unresolved no_reply awaiting <<<"$metrics"
if (( total > 0 )); then
  printf '\n💬 Threads:\n'
  printf '  Unresolved:        %d / %d\n' "$unresolved" "$total"
  printf '  Without replies:   %d\n' "$no_reply"
  printf '  Awaiting author:   %d\n' "$awaiting"
fi
if [[ "$all_json" != "[]" ]]; then
  partitioned=$(jq -c --argjson req "$required_json" '
    ($req | map(.name)) as $rn
    | [.[] | select(.bucket != "skipping")]
    | sort_by([(if .bucket == "fail" then 0 elif .bucket == "cancel" then 1 elif .bucket == "pending" then 2 elif .bucket == "pass" then 3 else 4 end), .name])
    | { required: [.[] | select(.name | IN($rn[]))],
        optional: [.[] | select(.name | IN($rn[]) | not)] }
  ' <<<"$all_json")
  bucket_lines='
    def bucket_emoji:
      if . == "pass" then "✅"
      elif . == "fail" then "🔴"
      elif . == "cancel" then "⊘"
      elif . == "pending" then "⏳"
      else "?"
      end;
  '
  required_lines=$(jq -r "$bucket_lines"'.required[] | "\(.bucket | bucket_emoji)\t\(.name)"' <<<"$partitioned")
  optional_lines=$(jq -r "$bucket_lines"'.optional[] | "\(.bucket | bucket_emoji)\t\(.name)"' <<<"$partitioned")
  if [[ -n $required_lines ]]; then
    printf '\nRequired:\n'
    while IFS=$'\t' read -r emoji cname; do
      printf '  %s  %s\n' "$emoji" "$cname"
    done <<<"$required_lines"
  fi
  if [[ -n $optional_lines ]]; then
    printf '\nOptional:\n'
    while IFS=$'\t' read -r emoji cname; do
      printf '  %s  %s\n' "$emoji" "$cname"
    done <<<"$optional_lines"
  fi
fi
''', "jj-pr-status"]

# pr-create: open a GitHub PR for the nearest bookmark, basing it on the
# next-nearest bookmark (or repo default if there isn't one). Title comes from
# the head commit's first description line; the configured AI drafts the body
# from the base..head diff and commit messages. The editor opens before posting.
# Extra args are forwarded to `gh pr create`.
#
# A bookmark that already has an open PR is left alone, so this is safe to run
# inside a half-published stack. When the stack holds more than one bookmark,
# the PR joins a GitHub stack: `pr-rebase` chains the bases and `stack-link`
# links the PRs. That covers a PR created in the middle or at the bottom of an
# existing stack, where the PRs above it have to be retargeted onto the new one.
pr-create = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bb)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
head="${bookmarks[0]}"
if (( ${#bookmarks[@]} > 1 )); then
  base="${bookmarks[1]}"
  diff_base="$base"
else
  base=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
  diff_base="trunk()"
fi
if ! existing=$(gh pr list --head "$head" --state open --json number --jq '.[0].number // empty'); then
  printf 'gh pr list failed for %s; not guessing whether a PR exists\n' "$head" >&2
  exit 1
fi
if [[ -n $existing ]]; then
  printf '==> PR #%s already covers %s, syncing instead of creating\n' "$existing" "$head" >&2
elif [[ -z $(jj log --no-graph -r "$head" -T 'description.first_line()') ]]; then
  echo "head commit has no description" >&2
  exit 1
fi
printf '\n==> Pushing stack\n' >&2
jj pr-push
if [[ -z $existing ]]; then
  printf '\n==> Creating PR for %s (base %s)\n' "$head" "$base" >&2
  jj-pr-new "$head" "$base" "$diff_base" "$@"
fi
if (( $(jj bs | wc -l | tr -d ' ') > 1 )); then
  printf '\n==> Reconciling PR bases\n' >&2
  jj pr-rebase
  printf '\n==> Syncing GitHub stack\n' >&2
  jj stack-link
fi
''', "jj-pr-create"]

# pr-describe: draft a PR description with the configured AI, open it in
# $EDITOR, then push the result to the PR via `gh pr edit`.
pr-describe = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
# The PR base fixes the revset, so a stacked PR only feeds its own revisions
# to the draft.
base=$(gh pr view "$head" --json baseRefName -q .baseRefName 2>/dev/null || true)
if [[ -n $base ]] && jj log --no-graph --ignore-working-copy -r "$base" -T '""' >/dev/null 2>&1; then
  revset="${base}..${head}"
else
  revset="trunk()..${head}"
fi
tmpdir=$(mktemp -d -t jj-pr-describe)
trap 'rm -rf "$tmpdir"' EXIT
body_file="$tmpdir/body.md"
jj-pr-body "$body_file" "$revset" gh pr diff "$head"
gh pr edit "$head" --body-file "$body_file"
''', "jj-pr-describe"]

# pr-edit: open the PR title and description in $EDITOR, separated by a marker
# line. On save, the first line becomes the new title and everything below the
# marker becomes the new body. Aborts if the marker is missing or the title is
# empty.
pr-edit = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
pr_data=$(gh pr view "$head" --json title,body)
title=$(jq -r .title <<<"$pr_data")
body=$(jq -r .body <<<"$pr_data")
marker="<!-- ▲ title above · description below ▼ — do not remove this line -->"
edit_file=$(mktemp -t jj-pr-edit).md
body_file=$(mktemp -t jj-pr-edit-body).md
trap 'rm -f "$edit_file" "$body_file"' EXIT
{
  printf '%s\n\n' "$title"
  printf '%s\n\n' "$marker"
  printf '%s\n' "$body"
} > "$edit_file"
orig_hash=$(shasum "$edit_file" | awk '{print $1}')
"${EDITOR:-vi}" "$edit_file"
new_hash=$(shasum "$edit_file" | awk '{print $1}')
if [[ "$orig_hash" == "$new_hash" ]]; then
  echo "no changes, not updating PR" >&2
  exit 0
fi
if ! grep -qF "$marker" "$edit_file"; then
  echo "separator line removed, aborting" >&2
  exit 1
fi
pre=$(awk -v m="$marker" '$0 == m {exit} {print}' "$edit_file")
post=$(awk -v m="$marker" 'found {print} $0 == m {found=1}' "$edit_file")
new_title=$(printf '%s' "$pre" | awk 'NF {print; exit}')
if [[ -z $new_title ]]; then
  echo "empty title, aborting" >&2
  exit 1
fi
extra_title_lines=$(printf '%s' "$pre" | awk -v t="$new_title" '
  NF && $0 != t { c++ } END { print c+0 }
')
if (( extra_title_lines > 0 )); then
  echo "title must be a single line (found $((extra_title_lines + 1)) non-blank lines above marker)" >&2
  exit 1
fi
new_body=$(printf '%s' "$post" | awk '
  /^[[:space:]]*$/ { if (started) buffered = buffered "\n"; next }
  { print buffered $0; buffered=""; started=1 }
')
printf '%s' "$new_body" > "$body_file"
gh pr edit "$head" --title "$new_title" --body-file "$body_file"
''', "jj-pr-edit"]

# pr-assign: fzf-pick one or more reviewers and request review on the nearest PR.
# Candidate list is GitHub's suggested reviewers followed by recent commit authors
# on the default branch (deduped, in order). Excludes self, PR author, and anyone
# already requested. TAB to multi-select.
pr-assign = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
me=$(gh api user --jq .login)
pr_data=$(gh pr view "$head" --json number,author,reviewRequests)
number=$(jq -r '.number' <<<"$pr_data")
author=$(jq -r '.author.login // empty' <<<"$pr_data")
existing=$(jq -r '.reviewRequests[]? | (.login // .name // empty)' <<<"$pr_data")
repo_info=$(gh repo view --json owner,name)
owner=$(jq -r '.owner.login' <<<"$repo_info")
repo=$(jq -r '.name' <<<"$repo_info")
suggested=$(gh api graphql \
  -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){suggestedReviewers{reviewer{login}}}}}' \
  -f owner="$owner" -f repo="$repo" -F number="$number" \
  --jq '.data.repository.pullRequest.suggestedReviewers[]?.reviewer.login // empty' \
  2>/dev/null || true)
recent=$(gh api -X GET "repos/{owner}/{repo}/commits" -f per_page=100 \
  --jq '.[].author.login // empty' 2>/dev/null || true)
exclude_file=$(mktemp -t jj-pr-assign-exclude)
candidates_file=$(mktemp -t jj-pr-assign-candidates)
trap 'rm -f "$exclude_file" "$candidates_file"' EXIT
printf '%s\n' "$me" "$author" "$existing" \
  | awk 'NF' | sort -u > "$exclude_file"
printf '%s\n' "$suggested" "$recent" \
  | awk 'NF && !seen[$0]++' \
  | (grep -vxFf "$exclude_file" || true) \
  > "$candidates_file"
if [[ ! -s $candidates_file ]]; then
  echo "no candidate reviewers" >&2
  exit 1
fi
sel=$(fzf -m --no-sort \
  --prompt="reviewer(s)> " \
  --header="TAB to multi-select, ENTER to confirm" \
  < "$candidates_file") || exit 0
[[ -z $sel ]] && exit 0
args=()
while IFS= read -r reviewer; do
  [[ -z $reviewer ]] && continue
  args+=(--add-reviewer "$reviewer")
done <<<"$sel"
gh pr edit "$head" "${args[@]}"
''', "jj-pr-assign"]

# pr-comments: browse inline review comments + top-level PR comments, plus a
# "<new comment>" entry for posting a fresh top-level comment. fzf-pick one,
# write the body in $EDITOR (any context is prefilled as `#`-prefixed lines and
# stripped on save). Inline replies thread via /pulls/N/comments/{id}/replies;
# top-level posts go to /issues/N/comments.
pr-comments = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
number=$(gh pr view "$head" --json number --jq .number)
repo_info=$(gh repo view --json owner,name)
owner=$(jq -r '.owner.login' <<<"$repo_info")
repo=$(jq -r '.name' <<<"$repo_info")
work_dir=$(mktemp -d -t jj-pr-comments)
trap 'rm -rf "$work_dir"' EXIT
mkdir -p "$work_dir/ctx"
gh api --paginate "/repos/$owner/$repo/pulls/$number/comments" \
  | jq -s 'add // []' > "$work_dir/review.json"
gh api --paginate "/repos/$owner/$repo/issues/$number/comments" \
  | jq -s 'add // []' > "$work_dir/issue.json"
# Synthetic <new comment> row, always first.
printf 'new\t+   <new comment>  (post a new top-level PR comment)\n' \
  > "$work_dir/fzf-input.tsv"
echo "(post a new top-level comment on PR #$number)" > "$work_dir/ctx/new.txt"
# Inline review comments — thread root first, replies chronological under it.
jq -r '
  sort_by([(.in_reply_to_id // .id), .created_at]) | .[]
  | [
      ("r" + (.id|tostring)),
      (if .in_reply_to_id then "  ↳ " else "    " end)
        + "@" + .user.login + "  "
        + .path + ":" + ((.line // .original_line // "?") | tostring) + "  "
        + (.body | gsub("[\\n\\r]+"; " ") | .[0:100])
    ]
  | @tsv
' "$work_dir/review.json" >> "$work_dir/fzf-input.tsv"
# Top-level (issue) comments — chronological.
jq -r '
  sort_by(.created_at) | .[]
  | [
      ("i" + (.id|tostring)),
      "    @" + .user.login + "  (top-level)  "
        + (.body | gsub("[\\n\\r]+"; " ") | .[0:100])
    ]
  | @tsv
' "$work_dir/issue.json" >> "$work_dir/fzf-input.tsv"
# Preview files keyed by prefixed id (r<id> / i<id> / new).
jq -r '.[].id' "$work_dir/review.json" | while read -r id; do
  jq -r --argjson id "$id" '
    .[] | select(.id == $id)
    | "@" + .user.login + " on " + .path + ":"
      + ((.line // .original_line // "?") | tostring) + "\n"
      + (if .in_reply_to_id then "(reply in thread " + (.in_reply_to_id|tostring) + ")\n" else "" end)
      + "\n" + .diff_hunk
      + "\n\n=== comment ===\n\n" + .body + "\n"
  ' "$work_dir/review.json" > "$work_dir/ctx/r$id.txt"
done
jq -r '.[].id' "$work_dir/issue.json" | while read -r id; do
  jq -r --argjson id "$id" '
    .[] | select(.id == $id)
    | "@" + .user.login + " (top-level)\n\n" + .body + "\n"
  ' "$work_dir/issue.json" > "$work_dir/ctx/i$id.txt"
done
sel=$(fzf --no-sort \
  --delimiter=$'\t' \
  --with-nth=2.. \
  --preview="cat $work_dir/ctx/{1}.txt" \
  --preview-window=down:60%:wrap \
  --bind=shift-up:preview-up,shift-down:preview-down,alt-u:preview-half-page-up,alt-d:preview-half-page-down \
  --prompt="comment> " \
  --header="↑/↓ pick · shift-↑/↓ scroll preview · alt-u/d half-page · ENTER post" \
  < "$work_dir/fzf-input.tsv") || exit 0
[[ -z $sel ]] && exit 0
sel_id=$(cut -f1 <<<"$sel")
reply_file="$work_dir/reply.md"
case "$sel_id" in
  new)
    {
      echo "# New top-level comment on PR #$number. Lines starting with # are stripped."
      echo
    } > "$reply_file"
    ;;
  *)
    {
      echo "# Reply to comment ${sel_id#[ri]}. Lines starting with # are stripped."
      echo "#"
      while IFS= read -r line; do
        if [[ -z $line ]]; then
          echo "#"
        else
          echo "# $line"
        fi
      done < "$work_dir/ctx/$sel_id.txt"
      echo
    } > "$reply_file"
    ;;
esac
"${EDITOR:-vi}" "$reply_file"
body=$(grep -v '^#' "$reply_file" || true)
if [[ -z "${body//[[:space:]]/}" ]]; then
  echo "empty body, aborting" >&2
  exit 1
fi
case "$sel_id" in
  r*)
    cid=${sel_id#r}
    gh api --method POST \
      "/repos/$owner/$repo/pulls/$number/comments/$cid/replies" \
      -f body="$body" >/dev/null
    echo "reply posted to inline comment $cid"
    ;;
  i*|new)
    gh api --method POST \
      "/repos/$owner/$repo/issues/$number/comments" \
      -f body="$body" >/dev/null
    echo "top-level comment posted on PR #$number"
    ;;
esac
''', "jj-pr-comments"]

# pr-update: fetch trunk, rebase the stack onto it, push, reconcile PR bases,
# and sync the GitHub stack. It never opens a PR. Use `jj stack update` for
# the same pass plus a PR for every bookmark that lacks one.
pr-update = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
printf '==> Fetching from remote\n'
jj git fetch
printf '\n==> Rebasing stack onto trunk\n'
jj rebase -d 'trunk()'
printf '\n==> Pushing stack\n'
jj pr-push
printf '\n==> Reconciling PR bases\n'
jj pr-rebase
printf '\n==> Syncing GitHub stack\n'
jj stack-link
''', "jj-pr-update"]

# pr-push: run pre-commit on the stack and push every bookmark in the stack.
# `jj precommit` leaves auto-fixes in a revision on top of @, so the nearest
# bookmark has to be advanced onto it or the fixes never reach the remote.
# The push covers `jj bs`, not `jj bb`: `jj rebase -d trunk()` moves the
# revisions above @ as well, and their bookmarks must reach the remote too or
# the stacked PRs above @ keep pointing at stale commits.
pr-push = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
nearest_name=$(jj bb | head -n1)
tip() {
  local rev
  rev=$(jj log --no-graph -r '@ & ~empty()' -T 'change_id' 2>/dev/null || true)
  [[ -z $rev ]] && rev=$(jj log --no-graph -r '@-' -T 'change_id')
  printf '%s' "$rev"
}
nearest=$(jj log --no-graph -r "$nearest_name" -T 'change_id')
tip_before=$(tip)
jj precommit 'trunk()..@'
if [[ "$nearest" == "$tip_before" ]]; then
  jj bm
elif [[ "$(tip)" != "$tip_before" ]]; then
  printf 'warning: pre-commit fixes are not covered by %s and will not be pushed\n' \
    "$nearest_name" >&2
fi
push_args=()
while IFS= read -r b; do
  push_args+=(--bookmark "$b")
done < <(jj bs)
if [[ ${#push_args[@]} -eq 0 ]]; then
  exit 1
fi
jj git push "${push_args[@]}"
''', "jj-pr-push"]

# stack-push: run pre-commit once per bookmark that differs from its open PR,
# bottom first, then push every bookmark in the stack. New PRs are always
# checked. Each bookmark is linted over its own PR diff (<bookmark
# below>..<bookmark>), so a fix lands in the PR that introduced the file
# instead of at the top of the stack, which is where a single `trunk()..@`
# pass puts every fix.
#
# `jj precommit` leaves a fix in a new revision on top of @, so this moves the
# bookmark being pushed onto that revision with `jj bm`, which also rebases the
# rest of the stack onto it. Without the move the fix stays outside the PR and
# never reaches the remote. The bookmark moves only when pre-commit actually
# left a revision behind: `jj bm` targets `@-` when @ is empty, so calling it
# unconditionally would drag a bookmark on an empty revision backwards.
#
# @ returns to where it started. An empty @ on top of the stack is abandoned by
# the first `jj edit`, so it is recreated on top instead.
stack-push = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bs)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
top="${bookmarks[${#bookmarks[@]} - 1]}"
start=$(jj log --no-graph -r '@' -T 'change_id')
restore() {
  if [[ -n $(jj log --no-graph -r "$start" -T 'change_id' 2>/dev/null) ]]; then
    jj edit "$start"
  else
    jj new "$top"
  fi
}
trap restore EXIT
for i in "${!bookmarks[@]}"; do
  b="${bookmarks[i]}"
  local_sha=$(jj log --no-graph -r "$b" -T 'commit_id')
  if ! remote_sha=$(gh pr list --head "$b" --state open --json headRefOid \
    --jq '.[0].headRefOid // empty'); then
    printf 'gh pr list failed for %s; not skipping its pre-commit checks\n' "$b" >&2
    exit 1
  fi
  if [[ -n $remote_sha && "$local_sha" == "$remote_sha" ]]; then
    printf '\n==> Skipping pre-commit for %s; its PR is up to date\n' "$b"
    continue
  fi
  if (( i == 0 )); then
    from='trunk()'
  else
    from="${bookmarks[i-1]}"
  fi
  printf '\n==> pre-commit for %s\n' "$b"
  jj edit "$b"
  jj precommit "${from}..${b}"
  if [[ "$(jj log --no-graph -r '@' -T 'change_id')" \
     != "$(jj log --no-graph -r "$b" -T 'change_id')" ]]; then
    printf '==> moving %s onto the pre-commit fixes\n' "$b"
    jj bm
  fi
done
push_args=()
for b in "${bookmarks[@]}"; do
  push_args+=(--bookmark "$b")
done
printf '\n==> Pushing %s bookmark(s)\n' "${#bookmarks[@]}"
jj git push "${push_args[@]}"
''', "jj-stack-push"]

# pr-rebase: reconcile each open PR's base to match the current stack ordering
# (the bookmark below it, or the repo default for the bottom of the stack).
# Walks `jj bs`, so a PR above @ is retargeted too.
#
# GitHub refuses to change the base of a PR that belongs to a stack. When a
# base must move, the GitHub stack that holds it is unstacked first, and the
# caller relinks it with `stack-link`. GitHub also refuses to unstack a PR that
# is queued for merge or has auto-merge enabled. Unstack that PR by hand first.
pr-rebase = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bs)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
heads=()
olds=()
news=()
numbers=()
for i in "${!bookmarks[@]}"; do
  head="${bookmarks[i]}"
  if (( i == 0 )); then
    expected_base="$default_branch"
  else
    expected_base="${bookmarks[i-1]}"
  fi
  if ! pr=$(gh pr list --head "$head" --state open --json number,baseRefName \
    --jq '.[0] | select(.number) | "\(.number)\t\(.baseRefName)"'); then
    printf 'gh pr list failed for %s; not guessing whether a PR exists\n' "$head" >&2
    exit 1
  fi
  if [[ -z $pr ]]; then
    continue
  fi
  IFS=$'\t' read -r number current_base <<<"$pr"
  if [[ "$current_base" == "$expected_base" ]]; then
    continue
  fi
  heads+=("$head")
  olds+=("$current_base")
  news+=("$expected_base")
  numbers+=("$number")
done
if [[ ${#heads[@]} -eq 0 ]]; then
  exit 0
fi
if gh api "repos/$repo/stacks" >/dev/null 2>&1; then
  if ! stacks=$(for n in "${numbers[@]}"; do
    gh api "repos/$repo/stacks?pull_request=$n" --jq '.[] | select(.open != false) | .number'
  done | awk 'NF' | sort -un); then
    printf 'gh api failed while looking up the stack of a PR to retarget\n' >&2
    exit 1
  fi
  for s in $stacks; do
    printf 'unstacking GitHub stack #%s so the bases can move\n' "$s"
    if ! gh api -X POST "repos/$repo/stacks/$s/unstack" >/dev/null; then
      printf 'failed to unstack #%s; unstack a merge-queued or auto-merge PR by hand\n' "$s" >&2
      exit 1
    fi
  done
fi
for i in "${!heads[@]}"; do
  printf 'rebasing PR for %s: %s -> %s\n' "${heads[i]}" "${olds[i]}" "${news[i]}"
  gh pr edit "${heads[i]}" --base "${news[i]}"
done
''', "jj-pr-rebase"]

# stack: dispatch to a stack-* subcommand (e.g. `jj stack create` ->
# `jj stack-create`). The `pr-*` aliases act on the nearest bookmark; the
# `stack-*` aliases act on every bookmark between trunk and the top of the
# stack.
stack = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
sub="${1:-help}"
shift || true
case "$sub" in
  help|-h|--help)
    cat <<EOF
jj stack <subcommand> [args]

Subcommands:
  create   Open a PR for every bookmark in the stack that has none, then sync
  update   Fetch trunk and rebase the stack, then run \`stack create\`
  push     Run pre-commit per bookmark, then push every bookmark
  link     Link the open PRs in the stack into a GitHub stacked PR
  merge    Check the whole stack, then merge it atomically on GitHub
EOF
    ;;
  create|update|push|link|merge)
    exec jj "stack-$sub" "$@"
    ;;
  *)
    echo "jj stack: unknown subcommand: $sub" >&2
    exit 1
    ;;
esac
''', "jj-stack"]

# stack-create: open a PR for every bookmark between trunk and the top of the
# stack that does not have one yet, bottom first, then reconcile the bases and
# link the stack. A bookmark that already has an open PR is skipped, so this
# fills the gaps in a half-published stack and is safe to re-run. Extra args go
# to every `gh pr create` it runs (e.g. `--draft`).
#
# The push goes through `stack-push`, which lints each bookmark over its own PR
# diff and moves that bookmark onto its own pre-commit fixes. So the PRs are
# created after every fix is in place, and each PR carries its own fixes.
#
# Each new PR costs one AI draft and one $EDITOR pass, in stack order.
stack-create = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bs)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
needs=()
todo=0
for i in "${!bookmarks[@]}"; do
  b="${bookmarks[i]}"
  if ! pr=$(gh pr list --head "$b" --state open --json number --jq '.[0].number // empty'); then
    printf 'gh pr list failed for %s; not guessing whether a PR exists\n' "$b" >&2
    exit 1
  fi
  if [[ -n $pr ]]; then
    needs[i]=0
    continue
  fi
  if [[ -z $(jj log --no-graph -r "$b" -T 'description.first_line()') ]]; then
    printf 'the revision for %s has no description; describe it first\n' "$b" >&2
    exit 1
  fi
  needs[i]=1
  todo=$((todo + 1))
done
if (( todo == 0 )); then
  printf '==> Every bookmark in the stack already has a PR\n'
else
  printf '==> Opening %s new PR(s)\n' "$todo"
fi
jj stack-push
n=0
for i in "${!bookmarks[@]}"; do
  if [[ "${needs[i]}" -eq 0 ]]; then
    continue
  fi
  b="${bookmarks[i]}"
  if (( i == 0 )); then
    base="$default_branch"
    from='trunk()'
  else
    base="${bookmarks[i-1]}"
    from="$base"
  fi
  n=$((n + 1))
  printf '\n==> [%s/%s] Creating PR for %s (base %s)\n' "$n" "$todo" "$b" "$base"
  jj-pr-new "$b" "$base" "$from" "$@"
done
printf '\n==> Reconciling PR bases\n'
jj pr-rebase
printf '\n==> Syncing GitHub stack\n'
jj stack-link
''', "jj-stack-create"]

# stack-update: fetch trunk and rebase the stack onto it, then run
# `stack-create`. This is `pr-update` plus a PR for every bookmark that lacks
# one, so it is the one command that takes a stack of bookmarks all the way to
# a stack of open PRs and keeps it current.
stack-update = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
printf '==> Fetching from remote\n'
jj git fetch
printf '\n==> Rebasing stack onto trunk\n'
jj rebase -d 'trunk()'
jj stack-create "$@"
''', "jj-stack-update"]

# stack-link: link every open PR in the stack into a GitHub stacked PR, ordered
# bottom to top. A bookmark without a PR is skipped, so a half-published stack
# still links the PRs that do exist. Run `jj pr rebase` first (or use `jj pr
# update`, which does both): GitHub builds the stack from the PR base chain.
#
# The REST API can only append to the top of a stack. Any other change to the
# order (a PR inserted in the middle or at the bottom, a bookmark reordered) is
# applied by unstacking and recreating the stack with the full list. GitHub
# refuses to unstack a PR that is queued for merge or has auto-merge enabled,
# which makes the recreate fail. Unstack that PR by hand first.
stack-link = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
if ! gh api "repos/$repo/stacks" >/dev/null 2>&1; then
  printf 'stacked PRs are not available for %s, skipping\n' "$repo"
  exit 0
fi
prs=()
while IFS= read -r b; do
  if ! n=$(gh pr list --head "$b" --state open --json number --jq '.[0].number // empty'); then
    printf 'gh pr list failed for %s; not rebuilding the stack from a partial list\n' "$b" >&2
    exit 1
  fi
  if [[ -n $n ]]; then
    prs+=("$n")
  fi
done < <(jj bs)
if [[ ${#prs[@]} -lt 2 ]]; then
  printf 'nothing to stack: %s open PR(s) in the stack\n' "${#prs[@]}"
  exit 0
fi
desired=$(printf '%s\n' "${prs[@]}")
create_stack() {
  local out
  out=$(printf '%s\n' "${prs[@]}" \
    | jq -Rn '[inputs | select(length > 0) | tonumber] | {pull_requests: .}' \
    | gh api -X POST "repos/$repo/stacks" --input - --jq '"#\(.number) \(.url)"')
  printf 'stacked %s PRs (%s): %s\n' "${#prs[@]}" "$(paste -sd, - <<<"$desired")" "$out"
}
if ! found=$(for n in "${prs[@]}"; do
  gh api "repos/$repo/stacks?pull_request=$n" --jq '.[] | select(.open != false) | .number'
done | awk 'NF' | sort -un); then
  printf 'gh api failed while looking up the stack; not rebuilding it from a partial list\n' >&2
  exit 1
fi
case $(printf '%s\n' "$found" | awk 'NF' | wc -l | tr -d ' ') in
  0)
    create_stack
    exit 0
    ;;
  1) ;;
  *)
    printf 'these PRs belong to more than one GitHub stack (%s); unstack them first\n' \
      "$(paste -sd, - <<<"$found")" >&2
    exit 1
    ;;
esac
stack=$(printf '%s\n' "$found" | awk 'NF' | head -n1)
existing=$(gh api "repos/$repo/stacks/$stack" \
  --jq '.pull_requests[] | select(.merged_at == null and .state == "open") | .number' \
  | awk 'NF')
if [[ "$existing" == "$desired" ]]; then
  printf 'stack #%s is already up to date\n' "$stack"
  exit 0
fi
existing_count=$(printf '%s\n' "$existing" | awk 'NF' | wc -l | tr -d ' ')
if (( existing_count > 0 )) \
  && [[ "$existing" == "$(printf '%s\n' "${prs[@]}" | head -n "$existing_count")" ]]; then
  add=$(printf '%s\n' "${prs[@]}" | tail -n "+$((existing_count + 1))")
  printf '%s\n' "$add" \
    | jq -Rn '[inputs | select(length > 0) | tonumber] | {pull_requests: .}' \
    | gh api -X POST "repos/$repo/stacks/$stack/add" --input - >/dev/null
  printf 'added PR(s) %s to the top of stack #%s\n' "$(paste -sd, - <<<"$add")" "$stack"
  exit 0
fi
printf 'rebuilding stack #%s: %s -> %s\n' \
  "$stack" "$(paste -sd, - <<<"$existing")" "$(paste -sd, - <<<"$desired")"
gh api -X POST "repos/$repo/stacks/$stack/unstack" >/dev/null
if ! create_stack; then
  printf 'failed to rebuild stack #%s; some of its PRs may still be stacked\n' "$stack" >&2
  exit 1
fi
''', "jj-stack-link"]

# stack-merge: merge the whole stack. Every bookmark is checked before anything
# merges, and every blocker is reported at once. A PR must be open, non-draft,
# free of conflicts, in sync with the local bookmark, based on the bookmark
# below it, approved (where review is required), and free of failing or pending
# required checks. `mergeable == UNKNOWN` does not block: GitHub reports it
# while it still computes the merge commit.
#
# The merge goes through `gh stack merge`, which is atomic: GitHub merges every
# PR in the stack or none of them. `stack-link` runs first so the GitHub stack
# matches the local stack, and the member list is compared against the local
# stack before the merge, because `gh stack merge` always includes everything
# below the PR it is given.
#
# A stack of one PR, a repo without the stacks API, and a missing `gh stack`
# extension fall back to a bottom-up `gh pr merge` loop. Each PR is retargeted
# onto the default branch first, because the squash-merge below it already put
# that content on trunk. The loop is not atomic, so it can leave a merged prefix
# behind.
#
# Cleanup covers every bookmark whose PR reached MERGED, so a partial fallback
# merge and an aborted run both end in a consistent state. It abandons every
# commit the merged PRs contained, recorded by change id before the merge,
# because a squash-merge puts all of that content on trunk under one new commit.
# A stack that entered a merge queue is still open, so the local stack stays
# untouched until it merges.
#
# Extra args go to `gh stack merge`, or to every `gh pr merge` on the fallback
# path. `--squash` is added unless the args name a merge method. `gh stack
# merge` refuses `--admin`; only the fallback path takes it.
stack-merge = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bs)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
method_given=0
for a in "$@"; do
  case "$a" in
    --merge|--rebase|--squash|--merge-method|--merge-method=*) method_given=1 ;;
  esac
done
if (( method_given == 0 )); then
  set -- --squash "$@"
fi
repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
printf '==> Checking %s bookmark(s)\n' "${#bookmarks[@]}"
shas=()
changes=()
numbers=()
blocked=0
for i in "${!bookmarks[@]}"; do
  b="${bookmarks[i]}"
  if (( i == 0 )); then
    expected_base="$default_branch"
    base_rev='trunk()'
  else
    expected_base="${bookmarks[i-1]}"
    base_rev="${bookmarks[i-1]}"
  fi
  shas[i]=$(jj log --no-graph -r "$b" -T 'commit_id')
  # Record the commits the squash-merge will absorb, by change id: a rebase
  # rewrites the commit ids, so a commit id captured here no longer resolves
  # after the fetch.
  changes[i]=$(jj log --no-graph -r "$base_rev..$b" -T 'change_id ++ "\n"' \
    | awk 'NF { printf "%spresent(%s)", (NR > 1 ? " | " : ""), $1 }')
  if ! pr=$(gh pr list --head "$b" --state open \
    --json number,isDraft,mergeable,reviewDecision,headRefOid,baseRefName \
    --jq '.[0] // empty'); then
    printf 'gh pr list failed for %s; not merging part of a stack\n' "$b" >&2
    exit 1
  fi
  if [[ -z $pr ]]; then
    printf '  🔴  %s: no open PR\n' "$b"
    blocked=$((blocked + 1))
    continue
  fi
  number=$(jq -r .number <<<"$pr")
  numbers[i]="$number"
  checks=$(gh pr checks "$b" --required --json bucket,name 2>/dev/null) || true
  [[ -z ${checks:-} ]] && checks='[]'
  fails=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks")
  pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks")
  reasons=$(jq -r \
    --arg base "$expected_base" \
    --arg sha "${shas[i]}" \
    --argjson fails "$fails" \
    --argjson pending "$pending" '
    [ (select(.isDraft) | "the PR is a draft"),
      (select(.mergeable == "CONFLICTING") | "the PR conflicts with \(.baseRefName)"),
      (select(.baseRefName != $base) | "the base is \(.baseRefName), not \($base); run `jj pr rebase`"),
      (select(.headRefOid != $sha) | "the remote head is \(.headRefOid[0:12]), not \($sha[0:12]); run `jj stack push`"),
      (select(.reviewDecision == "CHANGES_REQUESTED") | "a reviewer requested changes"),
      (select(.reviewDecision == "REVIEW_REQUIRED") | "the PR needs an approval"),
      (select($fails > 0) | "\($fails) failing required check(s)"),
      (select($pending > 0) | "\($pending) pending required check(s)")
    ] | .[]
  ' <<<"$pr")
  if [[ -z $reasons ]]; then
    printf '  ✅  #%s  %s\n' "$number" "$b"
    continue
  fi
  while IFS= read -r reason; do
    printf '  🔴  #%s  %s: %s\n' "$number" "$b" "$reason"
    blocked=$((blocked + 1))
  done <<<"$reasons"
done
if (( blocked > 0 )); then
  printf '\nrefusing to merge: %s blocker(s) in the stack\n' "$blocked" >&2
  exit 1
fi
desired=$(printf '%s\n' "${numbers[@]}")
stack=''
if (( ${#numbers[@]} > 1 )) \
  && gh stack --version >/dev/null 2>&1 \
  && gh api "repos/$repo/stacks" >/dev/null 2>&1; then
  printf '\n==> Syncing GitHub stack\n'
  jj stack-link
  if ! found=$(for n in "${numbers[@]}"; do
    gh api "repos/$repo/stacks?pull_request=$n" --jq '.[] | select(.open != false) | .number'
  done | awk 'NF' | sort -un); then
    printf 'gh api failed while looking up the stack; not merging a stack it cannot read\n' >&2
    exit 1
  fi
  case $(printf '%s\n' "$found" | awk 'NF' | wc -l | tr -d ' ') in
    0) ;;
    1) stack=$(printf '%s\n' "$found" | awk 'NF' | head -n1) ;;
    *)
      printf 'refusing to merge: these PRs belong to more than one GitHub stack (%s)\n' \
        "$(paste -sd, - <<<"$found")" >&2
      exit 1
      ;;
  esac
fi
if [[ -n $stack ]]; then
  members=$(gh api "repos/$repo/stacks/$stack" \
    --jq '.pull_requests[] | select(.merged_at == null and .state == "open") | .number' \
    | awk 'NF')
  if [[ "$members" != "$desired" ]]; then
    printf 'refusing to merge: stack #%s holds PR(s) %s, but the local stack is %s\n' \
      "$stack" "$(paste -sd, - <<<"$members")" "$(paste -sd, - <<<"$desired")" >&2
    exit 1
  fi
fi
cleanup() {
  merged=()
  merged_changes=()
  for i in "${!bookmarks[@]}"; do
    state=$(gh pr view "${numbers[i]}" --json state -q .state 2>/dev/null || echo UNKNOWN)
    if [[ "$state" == "MERGED" ]]; then
      merged+=("${bookmarks[i]}")
      if [[ -n "${changes[i]:-}" ]]; then
        merged_changes+=("${changes[i]}")
      fi
    fi
  done
  if (( ${#merged[@]} == 0 )); then
    printf '\n==> No PR reached MERGED, leaving the local stack alone\n'
    return 0
  fi
  printf '\n==> Cleaning up %s merged bookmark(s)\n' "${#merged[@]}"
  # Delete the remote branch *before* fetching so the fetch tears down the
  # remote-tracking ref. Otherwise an untracked remote ref lingers, and
  # untracked remotes are in immutable_heads() — which blocks the rebase below.
  for b in "${merged[@]}"; do
    gh api -X DELETE "repos/$repo/git/refs/heads/$b" --silent 2>/dev/null || true
  done
  jj git fetch
  for b in "${merged[@]}"; do
    jj bookmark forget --include-remotes "$b" 2>/dev/null || true
  done
  # The squash-merge put the content of every recorded commit on trunk, so all
  # of them must go. The fetch drops only the commit a deleted bookmark pointed
  # at, and it keeps any commit another bookmark still reaches, so a survivor
  # reapplies content trunk already has and conflicts on the rebase below.
  if (( ${#merged_changes[@]} > 0 )); then
    revset=$(printf ' | %s' "${merged_changes[@]}")
    jj abandon -r "${revset# | }" || true
  fi
  jj rebase -d 'trunk()'
  jj abandon 'trunk()..@ & empty()' 2>/dev/null || true
}
trap cleanup EXIT
if [[ -n $stack ]]; then
  printf '\n==> Merging stack #%s (PRs %s)\n' "$stack" "$(paste -sd, - <<<"$desired")"
  gh stack merge --yes "$stack" "$@"
  exit 0
fi
printf '\n==> Merging %s PR(s) one at a time\n' "${#bookmarks[@]}"
for i in "${!bookmarks[@]}"; do
  b="${bookmarks[i]}"
  printf '\n==> [%s/%s] Merging #%s %s\n' "$((i + 1))" "${#bookmarks[@]}" "${numbers[i]}" "$b"
  base=$(gh pr view "${numbers[i]}" --json baseRefName -q .baseRefName)
  if [[ "$base" != "$default_branch" ]]; then
    printf '==> Retargeting %s: %s -> %s\n' "$b" "$base" "$default_branch"
    gh pr edit "${numbers[i]}" --base "$default_branch"
  fi
  # Don't pass --delete-branch: gh's post-merge local-branch cleanup fails with
  # "could not determine current branch" because jj leaves git in detached-HEAD
  # state. The remote branch goes away in cleanup.
  gh pr merge "${numbers[i]}" --match-head-commit "${shas[i]}" "$@"
done
''', "jj-stack-merge"]

# pr-merge: merge the GitHub PR for the bookmark closest to @, but only if
# it targets the repo default branch and has no failing required status checks.
# After a successful merge, runs `jj pr-cleanup`. Extra args are forwarded to
# `gh pr merge`.
pr-merge = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
base=$(gh pr view "$head" --json baseRefName -q .baseRefName)
if [[ "$base" != "$default_branch" ]]; then
  printf 'refusing to merge: PR base is %s, not the default branch %s\n' "$base" "$default_branch" >&2
  exit 1
fi
checks_json=$(gh pr checks "$head" --required --json bucket 2>/dev/null) || true
fails=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"${checks_json:-[]}")
if [[ $fails -gt 0 ]]; then
  printf 'refusing to merge: %s failing required check(s)\n' "$fails" >&2
  exit 1
fi
head_sha=$(jj log --no-graph -r "$head" -T 'commit_id')
# Don't pass --delete-branch: gh's post-merge local-branch cleanup fails with
# "could not determine current branch" because jj leaves git in detached-HEAD
# state. pr-cleanup deletes the remote branch via the GitHub API and forgets
# the local bookmark.
gh pr merge "$head" --match-head-commit "$head_sha" --squash "$@"
jj pr-cleanup
''', "jj-pr-merge"]

# pr-cleanup: delete the remote branch, fetch the latest trunk, forget the
# merged PR's local bookmark, rebase the stack, and abandon any commits
# emptied by the squash-merge. Refuses to run if the PR isn't merged yet.
# Order matters: delete the remote branch *before* fetching so the fetch
# tears down the remote-tracking ref. Otherwise an untracked remote ref
# lingers, and untracked remotes are in immutable_heads() — which blocks
# the rebase below. `bookmark forget --include-remotes` is a belt-and-
# suspenders fallback if the API delete failed (e.g. no permission).
pr-cleanup = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
state=$(gh pr view "$head" --json state -q .state)
if [[ "$state" != "MERGED" ]]; then
  printf 'refusing to cleanup: PR for %s is %s, not MERGED\n' "$head" "$state" >&2
  exit 1
fi
repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
gh api -X DELETE "repos/$repo/git/refs/heads/$head" --silent 2>/dev/null || true
jj git fetch
jj bookmark forget --include-remotes "$head" 2>/dev/null || true
jj rebase -d 'trunk()'
jj abandon 'trunk()..@ & empty()' 2>/dev/null || true
''', "jj-pr-cleanup"]

# pr-close: close the GitHub PR for the bookmark closest to @ and forget the
# local bookmark. Refuses if the PR isn't OPEN. Revisions are left intact.
pr-close = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
state=$(gh pr view "$head" --json state -q .state)
if [[ "$state" != "OPEN" ]]; then
  printf 'refusing to close: PR for %s is %s, not OPEN\n' "$head" "$state" >&2
  exit 1
fi
gh pr close "$head"
jj git fetch
jj bookmark forget "$head" 2>/dev/null || true
''', "jj-pr-close"]

# pr-abandon: run pr-close, then abandon the PR's revisions. Captures the revs
# before pr-close runs since pr-close forgets the bookmark.
pr-abandon = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bb)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
head="${bookmarks[0]}"
if (( ${#bookmarks[@]} > 1 )); then
  prev="${bookmarks[1]}"
else
  prev="trunk()"
fi
revs=$(jj log --no-graph --ignore-working-copy \
  -r "${prev}..${head}" -T 'change_id ++ "\n"' 2>/dev/null \
  | awk 'NF' | paste -sd '|' -)
jj pr-close
if [[ -z $revs ]]; then
  exit 0
fi
jj abandon -r "$revs"
''', "jj-pr-abandon"]

# switch: fzf-pick a local bookmark and `jj edit` it.
switch = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
sel=$(jj log --no-graph --ignore-working-copy \
  -r "bookmarks()" \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' \
  2>/dev/null \
  | fzf --no-sort)
[[ -z ${sel:-} ]] && exit 0
exec jj edit "$sel"
''', "jj-switch"]

# start: fetch the latest trunk and create a new empty change on top of it.
start = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj git fetch
jj new 'trunk()'
''', "jj-start"]

# cc: draft a commit message with the configured AI, open it in $EDITOR,
# then finalize with `jj commit`.
cc = ["util", "exec", "--", "bash", "-c", "exec jj-ai-describe \"$1\"", "jj-cc", "commit"]

# cd: use the same draft flow with `jj describe` and stay on @.
cd = ["util", "exec", "--", "bash", "-c", "exec jj-ai-describe \"$1\"", "jj-cd", "describe"]

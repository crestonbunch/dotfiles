#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Creston Bunch"
email = "git@bunch.im"

[ui]
diff-editor = "diffview"
diff-formatter = ["difft", "--color=always", "$left", "$right"]
merge-editor = "nvimdiff"
[merge-tools.nvimdiff]
program = "nvim"
merge-args = [
  "-d", "$output",
  "-c", "rightbelow vert diffsplit $base",
  "-c", "wincmd h",
  "-c", "rightbelow diffsplit $left",
  "-c", "wincmd l",
  "-c", "rightbelow diffsplit $right",
  "-c", "wincmd t",
  "-c", "nnoremap <buffer> <leader>l :diffget 3<CR>",
  "-c", "nnoremap <buffer> <leader>b :diffget 2<CR>",
  "-c", "nnoremap <buffer> <leader>r :diffget 4<CR>",
]

[merge-tools.diffview]
# https://github.com/jj-vcs/jj/wiki/Vim,-Neovim
program = "sh"
edit-args = ["-c", '''
  set -eu
  rm -f "$right/JJ-INSTRUCTIONS"
  git -C "$left" init -q
  git -C "$left" add -A
  git -C "$left" commit -q -m baseline --allow-empty
  mv "$left/.git" "$right"
  (cd "$right"; nvim -c DiffviewOpen)
  # git -C "$right" add -p
  git -C "$right" diff-index --quiet --cached HEAD && { echo "No changes done, aborting split."; exit 1; }
  git -C "$right" commit -q -m split
  git -C "$right" restore . # undo changes in modified files
  git -C "$right" reset .   # undo --intent-to-add
  git -C "$right" clean -q -df # remove untracked files
''',
]

[remotes.origin]
auto-track-bookmarks = "glob:creston/*"
auto-track-created-bookmarks = "glob:creston/*"

[revsets]
log = "present(@) | ancestors((mine() ~ ::trunk()) | @, 2) | present(trunk())"

[revset-aliases]
"stack()" = "trunk()..@"

[aliases]
# Run pre-commit on files changed in a revset (default: @). Auto-fixes are
# captured in a new revision on top of @ and then `jj absorb`ed back into the
# nearest mutable revisions; the scratch revision is abandoned if empty.
#   jj precommit                       # check current change
#   jj precommit 'trunk()..@'          # check whole stack
precommit = ["util", "exec", "--", "sh", "-c", '''
set -eu
revset="${1:-@}"
files=$(jj diff --name-only -r "$revset")
if [ -z "$files" ]; then
  echo "No files changed in $revset"
  exit 0
fi
jj new
status=0
pre-commit run --files $files || status=$?
jj absorb
if [ -z "$(jj log --no-graph -r '@ & ~empty()' -T 'change_id' 2>/dev/null)" ]; then
  jj abandon
fi
# A non-zero first run can mean either auto-fixes were applied or there are
# unfixable issues. Re-run on the absorbed state to distinguish: a clean
# second run means everything was auto-fixed, so treat it as success.
if [ "$status" -ne 0 ]; then
  files=$(jj diff --name-only -r "$revset")
  [ -z "$files" ] && exit 0
  pre-commit run --files $files
fi
''', "jj-precommit"]

# `jj b`         — bookmark the most recent non-empty change in trunk()..@,
#                  slugged from its description.
b = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
rev="latest(trunk()..@ & ~empty())"
subject=$(jj log --no-graph -r "$rev" -T 'description.first_line()' 2>/dev/null)
if [[ -z $subject ]]; then
  echo "b: no non-empty change between trunk and @" >&2
  exit 1
fi
slug=$(printf '%s' "$subject" \
  | tr '[:upper:]' '[:lower:]' \
  | sed -E 's/[^a-z0-9]+/-/g; s/(^-+|-+$)//g')
if (( ${#slug} > 32 )); then
  slug=${slug:0:32}
  slug=${slug%-*}
fi
[[ -z $slug ]] && slug=wip
date=$(date +%m-%d)
branch="${USER}/${date}-${slug}"
if ! jj bookmark create "$branch" -r "$rev" 2>/dev/null; then
  suffix=$(jj log --no-graph -r "$rev" -T 'change_id.shortest()')
  branch="${branch}-${suffix}"
  jj bookmark create "$branch" -r "$rev"
fi
printf 'bookmark: %s @ %s\n' "$branch" "$(jj log --no-graph -r "$rev" -T 'commit_id.short()')"
''', "jj-b"]

# bb: list local bookmarks in trunk()..@ (mine), nearest to @ first.
bb = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
out=$(jj log --ignore-working-copy --no-graph \
  -r "trunk()..@ & bookmarks() & mine()" \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' 2>/dev/null)
if [[ -z ${out:-} ]]; then
  echo "no bookmark found between trunk and @" >&2
  exit 1
fi
printf '%s\n' "$out"
''', "jj-bb"]

# bm: bookmark move. Find the closest bookmark in trunk()..@, target @ (or @-
# if @ is empty), rebase descendants of the bookmark's old position that
# aren't on the line through the target onto the target, and move the
# bookmark.
bm = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bb | head -n1)
if [[ -n $(jj log --no-graph -r "@ & empty()" -T 'change_id' 2>/dev/null) ]]; then
  target="@-"
else
  target="@"
fi
old_rev=$(jj log --no-graph -r "$name" -T 'change_id')
new_rev=$(jj log --no-graph -r "$target" -T 'change_id')
if [[ "$old_rev" != "$new_rev" ]]; then
  descendants=$(jj log --no-graph --ignore-working-copy \
    -r "roots(((${old_rev}::) ~ ${old_rev}) & ~(::${new_rev}) & ~(${new_rev}::))" \
    -T 'change_id ++ "\n"' 2>/dev/null)
  if [[ -n "$descendants" ]]; then
    rebase_args=()
    while IFS= read -r rev; do
      [[ -z "$rev" ]] && continue
      rebase_args+=(-s "$rev")
    done <<<"$descendants"
    jj rebase "${rebase_args[@]}" -d "$new_rev"
  fi
  jj bookmark move "$name" --to "$new_rev" --allow-backwards
fi
''', "jj-bm"]

# pr: dispatch to a pr-* subcommand (e.g. `jj pr merge` -> `jj pr-merge`).
pr = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
sub="${1:-help}"
shift || true
case "$sub" in
  help|-h|--help)
    cat <<EOF
jj pr <subcommand> [args]

Subcommands:
  open       Open the GitHub PR for the nearest bookmark in a browser
  status     Show CI status checks for the nearest bookmark's PR
  create     Create a GitHub PR for the nearest bookmark
  describe   Draft a PR description with Claude, edit, and update the PR
  assign     Pick reviewer(s) via fzf and request review on the PR
  comments   Browse review comments and reply to one via $EDITOR
  update     Fetch trunk, rebase the stack, push, and reconcile PR bases
  push       Run pre-commit on the stack and push every bookmark
  rebase     Reconcile each open PR base to match the current stack
  merge      Merge the nearest bookmark PR (with safety checks)
  cleanup    After a merge, forget the local bookmark and rebase onto trunk
EOF
    ;;
  open|status|create|describe|assign|comments|update|push|rebase|merge|cleanup)
    exec jj "pr-$sub" "$@"
    ;;
  *)
    echo "jj pr: unknown subcommand: $sub" >&2
    exit 1
    ;;
esac
''', "jj-pr"]

# pr-open: open the GitHub PR for the bookmark closest to @ (in trunk()..@, mine).
pr-open = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bb | head -n1)
exec gh pr view --web "$name"
''', "jj-pr-open"]

# pr-status: show a summary of the PR for the bookmark closest to @ — title,
# local vs remote head SHA, change stats, and CI checks (skipped ones omitted).
pr-status = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
name=$(jj bb | head -n1)
local_sha=$(jj log --no-graph -r "$name" -T 'commit_id')
pr_data=$(gh pr view "$name" --json number,title,headRefOid,additions,deletions,changedFiles,reviewRequests,latestReviews)
number=$(jq -r .number <<<"$pr_data")
title=$(jq -r .title <<<"$pr_data")
remote_sha=$(jq -r .headRefOid <<<"$pr_data")
additions=$(jq -r .additions <<<"$pr_data")
deletions=$(jq -r .deletions <<<"$pr_data")
changed_files=$(jq -r .changedFiles <<<"$pr_data")
if [[ "$local_sha" == "$remote_sha" ]]; then
  sync="in sync"
else
  sync="out of sync"
fi
printf 'PR #%s — %s\n\n' "$number" "$title"
printf '  Local:    %s\n' "${local_sha:0:12}"
printf '  Remote:   %s (%s)\n' "${remote_sha:0:12}" "$sync"
printf '  Changes:  +%s -%s across %s file(s)\n' "$additions" "$deletions" "$changed_files"
reviewer_lines=$(jq -r '
  def rank:
    if . == "changes_requested" then 0
    elif . == "pending" then 1
    elif . == "commented" then 2
    elif . == "approved" then 3
    elif . == "dismissed" then 4
    else 5 end;
  ([.latestReviews[]? | select(.author.login != null)
    | {(.author.login): (.state | ascii_downcase)}] | add // {}) as $rev
  | ([.reviewRequests[]? | (.login // .name // empty) | select(. != "")]) as $req
  | reduce $req[] as $u ($rev; .[$u] = "pending")
  | to_entries
  | sort_by([(.value | rank), .key])
  | .[] | "\(.value)\t\(.key)"
' <<<"$pr_data")
printf '\nReviewers:\n'
if [[ -z $reviewer_lines ]]; then
  printf '  (none assigned)\n'
else
  while IFS=$'\t' read -r state user; do
    printf '  %-10s %s\n' "$state" "$user"
  done <<<"$reviewer_lines"
fi
repo_info=$(gh repo view --json owner,name)
owner=$(jq -r '.owner.login' <<<"$repo_info")
repo=$(jq -r '.name' <<<"$repo_info")
threads_json=$(gh api graphql \
  -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){author{login}reviewThreads(first:100){nodes{isResolved comments(first:100){nodes{author{login}}}}}}}}' \
  -f owner="$owner" -f repo="$repo" -F number="$number" 2>/dev/null || echo '{}')
metrics=$(jq -r '
  .data.repository.pullRequest as $pr
  | ($pr.author.login // "") as $author
  | ($pr.reviewThreads.nodes // []) as $threads
  | ($threads | map(select(.isResolved | not))) as $open
  | [
      ($threads | length),
      ($open | length),
      ($open | map(select((.comments.nodes | length) == 1)) | length),
      ($open | map(select((.comments.nodes | last | .author.login // "") != $author)) | length)
    ]
  | @tsv
' <<<"$threads_json")
IFS=$'\t' read -r total unresolved no_reply awaiting <<<"$metrics"
if (( total > 0 )); then
  printf '\nThreads:\n'
  printf '  Unresolved:        %d / %d\n' "$unresolved" "$total"
  printf '  Without replies:   %d\n' "$no_reply"
  printf '  Awaiting author:   %d\n' "$awaiting"
fi
all_json=$(gh pr checks "$name" --json bucket,name 2>/dev/null || true)
required_json=$(gh pr checks "$name" --required --json name 2>/dev/null || true)
[[ -z "${all_json:-}" ]] && all_json="[]"
[[ -z "${required_json:-}" ]] && required_json="[]"
if [[ "$all_json" != "[]" ]]; then
  partitioned=$(jq -c --argjson req "$required_json" '
    ($req | map(.name)) as $rn
    | [.[] | select(.bucket != "skipping")]
    | sort_by([(if .bucket == "fail" then 0 elif .bucket == "cancel" then 1 elif .bucket == "pending" then 2 elif .bucket == "pass" then 3 else 4 end), .name])
    | { required: [.[] | select(.name | IN($rn[]))],
        optional: [.[] | select(.name | IN($rn[]) | not)] }
  ' <<<"$all_json")
  required_lines=$(jq -r '.required[] | "\(.bucket)\t\(.name)"' <<<"$partitioned")
  optional_lines=$(jq -r '.optional[] | "\(.bucket)\t\(.name)"' <<<"$partitioned")
  if [[ -n $required_lines ]]; then
    printf '\nRequired:\n'
    while IFS=$'\t' read -r bucket cname; do
      printf '  %-8s %s\n' "$bucket" "$cname"
    done <<<"$required_lines"
  fi
  if [[ -n $optional_lines ]]; then
    printf '\nOptional:\n'
    while IFS=$'\t' read -r bucket cname; do
      printf '  %-8s %s\n' "$bucket" "$cname"
    done <<<"$optional_lines"
  fi
fi
''', "jj-pr-status"]

# pr-create: open a GitHub PR for the nearest bookmark, basing it on the
# next-nearest bookmark (or repo default if there isn't one). Title comes from
# the head commit's first description line; body is drafted by Claude (sonnet)
# from the base..head diff and opened in $EDITOR for review before posting.
# Extra args are forwarded to `gh pr create`.
pr-create = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bb)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
head="${bookmarks[0]}"
if (( ${#bookmarks[@]} > 1 )); then
  base="${bookmarks[1]}"
else
  base=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
fi
title=$(jj log --no-graph -r "$head" -T 'description.first_line()')
printf '==> Pushing stack\n' >&2
jj pr-push
if [[ -z $title ]]; then
  echo "head commit has no description" >&2
  exit 1
fi
prompt_file="$HOME/.config/jj/PR_DESCRIBE_PROMPT.md"
if [[ ! -f $prompt_file ]]; then
  echo "missing prompt file: $prompt_file" >&2
  exit 1
fi
repo_root=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
template_path=""
for candidate in \
  .github/PULL_REQUEST_TEMPLATE.md .github/pull_request_template.md \
  PULL_REQUEST_TEMPLATE.md pull_request_template.md \
  docs/PULL_REQUEST_TEMPLATE.md docs/pull_request_template.md; do
  if [[ -f "$repo_root/$candidate" ]]; then
    template_path="$repo_root/$candidate"
    break
  fi
done
prompt_input=$(mktemp -t jj-pr-create-prompt)
body_file=$(mktemp -t jj-pr-create).md
trap 'rm -f "$prompt_input" "$body_file"' EXIT
{
  cat "$prompt_file"
  echo
  if [[ -n $template_path ]]; then
    echo "## GitHub PR template"
    echo
    cat "$template_path"
    echo
  fi
  echo "## Git diff"
  echo
  jj diff --from "$base" --to "$head" --git
} > "$prompt_input"
echo "==> Drafting description with Claude (sonnet)..." >&2
claude --model sonnet --print "$(cat "$prompt_input")" > "$body_file"
"${EDITOR:-vi}" "$body_file"
if [[ ! -s $body_file ]]; then
  echo "empty description, not creating PR" >&2
  exit 1
fi
exec gh pr create --head "$head" --base "$base" --title "$title" --body-file "$body_file" "$@"
''', "jj-pr-create"]

# pr-describe: draft a PR description with Claude (sonnet), open it in $EDITOR
# for review/edit, then push the result to the PR via `gh pr edit`.
pr-describe = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
prompt_file="$HOME/.config/jj/PR_DESCRIBE_PROMPT.md"
if [[ ! -f $prompt_file ]]; then
  echo "missing prompt file: $prompt_file" >&2
  exit 1
fi
repo_root=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
template_path=""
for candidate in \
  .github/PULL_REQUEST_TEMPLATE.md .github/pull_request_template.md \
  PULL_REQUEST_TEMPLATE.md pull_request_template.md \
  docs/PULL_REQUEST_TEMPLATE.md docs/pull_request_template.md; do
  if [[ -f "$repo_root/$candidate" ]]; then
    template_path="$repo_root/$candidate"
    break
  fi
done
prompt_input=$(mktemp -t jj-pr-describe-prompt)
output_file=$(mktemp -t jj-pr-describe).md
trap 'rm -f "$prompt_input" "$output_file"' EXIT
{
  cat "$prompt_file"
  echo
  if [[ -n $template_path ]]; then
    echo "## GitHub PR template"
    echo
    cat "$template_path"
    echo
  fi
  echo "## Git diff"
  echo
  gh pr diff "$head"
} > "$prompt_input"
echo "==> Drafting description with Claude (sonnet)..." >&2
claude --model sonnet --print "$(cat "$prompt_input")" > "$output_file"
"${EDITOR:-vi}" "$output_file"
if [[ ! -s $output_file ]]; then
  echo "empty description, not updating PR" >&2
  exit 1
fi
gh pr edit "$head" --body-file "$output_file"
''', "jj-pr-describe"]

# pr-assign: fzf-pick one or more reviewers and request review on the nearest PR.
# Candidate list is GitHub's suggested reviewers followed by recent commit authors
# on the default branch (deduped, in order). Excludes self, PR author, and anyone
# already requested. TAB to multi-select.
pr-assign = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
me=$(gh api user --jq .login)
pr_data=$(gh pr view "$head" --json number,author,reviewRequests)
number=$(jq -r '.number' <<<"$pr_data")
author=$(jq -r '.author.login // empty' <<<"$pr_data")
existing=$(jq -r '.reviewRequests[]? | (.login // .name // empty)' <<<"$pr_data")
repo_info=$(gh repo view --json owner,name)
owner=$(jq -r '.owner.login' <<<"$repo_info")
repo=$(jq -r '.name' <<<"$repo_info")
suggested=$(gh api graphql \
  -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){suggestedReviewers{reviewer{login}}}}}' \
  -f owner="$owner" -f repo="$repo" -F number="$number" \
  --jq '.data.repository.pullRequest.suggestedReviewers[]?.reviewer.login // empty' \
  2>/dev/null || true)
recent=$(gh api -X GET "repos/{owner}/{repo}/commits" -f per_page=100 \
  --jq '.[].author.login // empty' 2>/dev/null || true)
exclude_file=$(mktemp -t jj-pr-assign-exclude)
candidates_file=$(mktemp -t jj-pr-assign-candidates)
trap 'rm -f "$exclude_file" "$candidates_file"' EXIT
printf '%s\n' "$me" "$author" "$existing" \
  | awk 'NF' | sort -u > "$exclude_file"
printf '%s\n' "$suggested" "$recent" \
  | awk 'NF && !seen[$0]++' \
  | (grep -vxFf "$exclude_file" || true) \
  > "$candidates_file"
if [[ ! -s $candidates_file ]]; then
  echo "no candidate reviewers" >&2
  exit 1
fi
sel=$(fzf -m --no-sort \
  --prompt="reviewer(s)> " \
  --header="TAB to multi-select, ENTER to confirm" \
  < "$candidates_file") || exit 0
[[ -z $sel ]] && exit 0
args=()
while IFS= read -r reviewer; do
  [[ -z $reviewer ]] && continue
  args+=(--add-reviewer "$reviewer")
done <<<"$sel"
gh pr edit "$head" "${args[@]}"
''', "jj-pr-assign"]

# pr-comments: browse inline review comments + top-level PR comments, plus a
# "<new comment>" entry for posting a fresh top-level comment. fzf-pick one,
# write the body in $EDITOR (any context is prefilled as `#`-prefixed lines and
# stripped on save). Inline replies thread via /pulls/N/comments/{id}/replies;
# top-level posts go to /issues/N/comments.
pr-comments = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
if ! gh pr view "$head" --json number >/dev/null 2>&1; then
  echo "no PR found for $head" >&2
  exit 1
fi
number=$(gh pr view "$head" --json number --jq .number)
repo_info=$(gh repo view --json owner,name)
owner=$(jq -r '.owner.login' <<<"$repo_info")
repo=$(jq -r '.name' <<<"$repo_info")
work_dir=$(mktemp -d -t jj-pr-comments)
trap 'rm -rf "$work_dir"' EXIT
mkdir -p "$work_dir/ctx"
gh api --paginate "/repos/$owner/$repo/pulls/$number/comments" \
  | jq -s 'add // []' > "$work_dir/review.json"
gh api --paginate "/repos/$owner/$repo/issues/$number/comments" \
  | jq -s 'add // []' > "$work_dir/issue.json"
# Synthetic <new comment> row, always first.
printf 'new\t+   <new comment>  (post a new top-level PR comment)\n' \
  > "$work_dir/fzf-input.tsv"
echo "(post a new top-level comment on PR #$number)" > "$work_dir/ctx/new.txt"
# Inline review comments — thread root first, replies chronological under it.
jq -r '
  sort_by([(.in_reply_to_id // .id), .created_at]) | .[]
  | [
      ("r" + (.id|tostring)),
      (if .in_reply_to_id then "  ↳ " else "    " end)
        + "@" + .user.login + "  "
        + .path + ":" + ((.line // .original_line // "?") | tostring) + "  "
        + (.body | gsub("[\\n\\r]+"; " ") | .[0:100])
    ]
  | @tsv
' "$work_dir/review.json" >> "$work_dir/fzf-input.tsv"
# Top-level (issue) comments — chronological.
jq -r '
  sort_by(.created_at) | .[]
  | [
      ("i" + (.id|tostring)),
      "    @" + .user.login + "  (top-level)  "
        + (.body | gsub("[\\n\\r]+"; " ") | .[0:100])
    ]
  | @tsv
' "$work_dir/issue.json" >> "$work_dir/fzf-input.tsv"
# Preview files keyed by prefixed id (r<id> / i<id> / new).
jq -r '.[].id' "$work_dir/review.json" | while read -r id; do
  jq -r --argjson id "$id" '
    .[] | select(.id == $id)
    | "@" + .user.login + " on " + .path + ":"
      + ((.line // .original_line // "?") | tostring) + "\n"
      + (if .in_reply_to_id then "(reply in thread " + (.in_reply_to_id|tostring) + ")\n" else "" end)
      + "\n" + .diff_hunk
      + "\n\n=== comment ===\n\n" + .body + "\n"
  ' "$work_dir/review.json" > "$work_dir/ctx/r$id.txt"
done
jq -r '.[].id' "$work_dir/issue.json" | while read -r id; do
  jq -r --argjson id "$id" '
    .[] | select(.id == $id)
    | "@" + .user.login + " (top-level)\n\n" + .body + "\n"
  ' "$work_dir/issue.json" > "$work_dir/ctx/i$id.txt"
done
sel=$(fzf --no-sort \
  --delimiter=$'\t' \
  --with-nth=2.. \
  --preview="cat $work_dir/ctx/{1}.txt" \
  --preview-window=down:60%:wrap \
  --bind=shift-up:preview-up,shift-down:preview-down,alt-u:preview-half-page-up,alt-d:preview-half-page-down \
  --prompt="comment> " \
  --header="↑/↓ pick · shift-↑/↓ scroll preview · alt-u/d half-page · ENTER post" \
  < "$work_dir/fzf-input.tsv") || exit 0
[[ -z $sel ]] && exit 0
sel_id=$(cut -f1 <<<"$sel")
reply_file="$work_dir/reply.md"
case "$sel_id" in
  new)
    {
      echo "# New top-level comment on PR #$number. Lines starting with # are stripped."
      echo
    } > "$reply_file"
    ;;
  *)
    {
      echo "# Reply to comment ${sel_id#[ri]}. Lines starting with # are stripped."
      echo "#"
      while IFS= read -r line; do
        if [[ -z $line ]]; then
          echo "#"
        else
          echo "# $line"
        fi
      done < "$work_dir/ctx/$sel_id.txt"
      echo
    } > "$reply_file"
    ;;
esac
"${EDITOR:-vi}" "$reply_file"
body=$(grep -v '^#' "$reply_file" || true)
if [[ -z "${body//[[:space:]]/}" ]]; then
  echo "empty body, aborting" >&2
  exit 1
fi
case "$sel_id" in
  r*)
    cid=${sel_id#r}
    gh api --method POST \
      "/repos/$owner/$repo/pulls/$number/comments/$cid/replies" \
      -f body="$body" >/dev/null
    echo "reply posted to inline comment $cid"
    ;;
  i*|new)
    gh api --method POST \
      "/repos/$owner/$repo/issues/$number/comments" \
      -f body="$body" >/dev/null
    echo "top-level comment posted on PR #$number"
    ;;
esac
''', "jj-pr-comments"]

# pr-update: fetch trunk, rebase the stack onto it, push, and reconcile PR bases.
pr-update = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
printf '==> Fetching from remote\n'
jj git fetch
printf '\n==> Rebasing stack onto trunk\n'
jj rebase -d 'trunk()'
printf '\n==> Pushing stack\n'
jj pr-push
printf '\n==> Reconciling PR bases\n'
jj pr-rebase
''', "jj-pr-update"]

# pr-push: run pre-commit on the stack and push every bookmark in trunk()..@.
pr-push = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bb)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
jj precommit 'trunk()..@'
push_args=()
for b in "${bookmarks[@]}"; do
  push_args+=(--bookmark "$b")
done
jj git push "${push_args[@]}"
''', "jj-pr-push"]

# pr-rebase: reconcile each open PR's base to match the current stack
# ordering (next-nearest bookmark, or repo default for the bottom of the stack).
pr-rebase = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
bookmarks=()
while IFS= read -r line; do
  bookmarks+=("$line")
done < <(jj bb)
if [[ ${#bookmarks[@]} -eq 0 ]]; then
  exit 1
fi
default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
for i in "${!bookmarks[@]}"; do
  head="${bookmarks[i]}"
  if (( i + 1 < ${#bookmarks[@]} )); then
    expected_base="${bookmarks[i+1]}"
  else
    expected_base="$default_branch"
  fi
  current_base=$(gh pr list --head "$head" --state open --json baseRefName --jq '.[0].baseRefName // empty')
  if [[ -z $current_base ]]; then
    continue
  fi
  if [[ "$current_base" != "$expected_base" ]]; then
    printf 'rebasing PR for %s: %s -> %s\n' "$head" "$current_base" "$expected_base"
    gh pr edit "$head" --base "$expected_base"
  fi
done
''', "jj-pr-rebase"]

# pr-merge: merge the GitHub PR for the bookmark closest to @, but only if
# it targets the repo default branch and has no failing required status checks.
# After a successful merge, runs `jj pr-cleanup`. Extra args are forwarded to
# `gh pr merge`.
pr-merge = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
base=$(gh pr view "$head" --json baseRefName -q .baseRefName)
if [[ "$base" != "$default_branch" ]]; then
  printf 'refusing to merge: PR base is %s, not the default branch %s\n' "$base" "$default_branch" >&2
  exit 1
fi
checks_json=$(gh pr checks "$head" --required --json bucket 2>/dev/null) || true
fails=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"${checks_json:-[]}")
if [[ $fails -gt 0 ]]; then
  printf 'refusing to merge: %s failing required check(s)\n' "$fails" >&2
  exit 1
fi
head_sha=$(jj log --no-graph -r "$head" -T 'commit_id')
# Don't pass --delete-branch: gh's post-merge local-branch cleanup fails with
# "could not determine current branch" because jj leaves git in detached-HEAD
# state. pr-cleanup forgets the local bookmark; the remote branch sticks
# around (GitHub auto-delete-on-merge can clean it up server-side).
gh pr merge "$head" --match-head-commit "$head_sha" --squash "$@"
jj pr-cleanup
''', "jj-pr-merge"]

# pr-cleanup: fetch the latest trunk, forget the merged PR's local bookmark,
# rebase the stack, and abandon any commits emptied by the squash-merge.
# Refuses to run if the PR isn't merged yet. Order matters: fetching first lets
# jj see any remote branch deletion (e.g. from GitHub's auto-delete-branch-on-
# merge setting) so the subsequent `bookmark forget` doesn't leave an untracked
# remote ref behind (untracked remotes are in immutable_heads() and would
# block the rebase). If the remote branch still exists after fetch, the rebase
# may fail; delete it on GitHub or enable auto-delete-branch-on-merge.
pr-cleanup = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
head=$(jj bb | head -n1)
state=$(gh pr view "$head" --json state -q .state)
if [[ "$state" != "MERGED" ]]; then
  printf 'refusing to cleanup: PR for %s is %s, not MERGED\n' "$head" "$state" >&2
  exit 1
fi
jj git fetch
jj bookmark forget "$head" 2>/dev/null || true
jj rebase -d 'trunk()'
jj abandon 'trunk()..@ & empty()' 2>/dev/null || true
''', "jj-pr-cleanup"]

# switch: fzf-pick a local bookmark and `jj edit` it.
switch = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
sel=$(jj log --no-graph --ignore-working-copy \
  -r "bookmarks()" \
  -T 'local_bookmarks.map(|b| b.name() ++ "\n").join("")' \
  2>/dev/null \
  | fzf --no-sort)
[[ -z ${sel:-} ]] && exit 0
exec jj edit "$sel"
''', "jj-switch"]

# start: fetch the latest trunk and create a new empty change on top of it.
start = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj git fetch
jj new 'trunk()'
''', "jj-start"]

command_timeout = 1000

[python]
disabled = true

[custom.python]
command = '''awk -F' *= *' '/^(version_info|version)/ {print $2; exit}' "${VIRTUAL_ENV:-.venv}/pyvenv.cfg"'''
description = "Python version from the project venv's pyvenv.cfg (hidden when uv.lock exists)"
format = 'via [🐍 $output]($style) '
shell = ["/bin/sh"]
style = "yellow bold"
when = 'test -f "${VIRTUAL_ENV:-.venv}/pyvenv.cfg" && ! test -f uv.lock'

[custom.uv]
command = '''awk -F' *= *' '/^(version_info|version)/ {print $2; exit}' "${VIRTUAL_ENV:-.venv}/pyvenv.cfg" 2>/dev/null || true'''
description = "uv project (with python version from the venv's pyvenv.cfg if present)"
format = 'via [🦄 uv $output]($style) '
shell = ["/bin/sh"]
style = "purple bold"
when = "test -f uv.lock"

[custom.mise]
description = "Indicator that a local mise config is active"
format = 'via [󰢛 mise]($style) '
shell = ["/bin/sh"]
style = "#ff5f87 bold"
when = 'command -v mise >/dev/null 2>&1 && test -n "$(mise config ls --no-header 2>/dev/null)"'

[custom.jj]
command = '''
bookmark=$(jj --ignore-working-copy --no-pager bbt 2>/dev/null | head -1)
jj log --revisions @ --no-graph --ignore-working-copy --color always --limit 1 --template '
  separate(" ",
    change_id.shortest(4),
    if("'"$bookmark"'" != "", raw_escape_sequence("\x1b[38;5;5m") ++ "'"$bookmark"'" ++ raw_escape_sequence("\x1b[39m")),
    concat(
      if(conflict, "💥"),
      if(divergent, "🚧"),
      if(hidden, "👻"),
      if(immutable, "🔒"),
    ),
    raw_escape_sequence("\x1b[1;32m") ++ if(empty, "(empty)"),
    raw_escape_sequence("\x1b[1;32m") ++ coalesce(
      truncate_end(29, description.first_line(), "…"),
      "(no description set)",
    ) ++ raw_escape_sequence("\x1b[0m"),
  )
'
'''
description = "The current jj status"
shell = ["/bin/sh"]
symbol = "⬡ "
when = "jj --ignore-working-copy root"

[aws]
disabled = true

[git_status]
disabled = true

[custom.git_status]
command = "starship module git_status"
description = "Only show git_status if we're not in a jj repo"
shell = ["/bin/sh"]
style = ""
when = "! jj --ignore-working-copy root"

[git_commit]
disabled = true

[custom.git_commit]
command = "starship module git_commit"
description = "Only show git_commit if we're not in a jj repo"
shell = ["/bin/sh"]
style = ""
when = "! jj --ignore-working-copy root"

[git_metrics]
disabled = true

[custom.git_metrics]
command = "starship module git_metrics"
description = "Only show git_metrics if we're not in a jj repo"
shell = ["/bin/sh"]
style = ""
when = "! jj --ignore-working-copy root"

[git_branch]
disabled = true

[custom.git_branch]
command = "starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"
shell = ["/bin/sh"]
style = ""
when = "! jj --ignore-working-copy root"
